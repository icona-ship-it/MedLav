name: Weekly Off-site Backup (DB + Storage)

# ─────────────────────────────────────────────────────────────────────────────
# Off-site backup settimanale verso Cloudflare R2 (EU storage):
#   1. pg_dump del DB Supabase  → r2://$R2_BUCKET/db/<timestamp>.sql.gz[.gpg]
#   2. Bucket Storage (documents + signatures, incluse le immagini OCR che
#      vivono dentro `documents/ocr-images/`) → tar.gz cifrato con gpg
#      simmetrico (AES256) → r2://$R2_BUCKET/storage/<timestamp>.tar.gz.gpg
#
# Retention: 12 settimane (3 mesi) per entrambi i prefissi (db/ e storage/).
# Trigger: cron domenica 03:00 UTC + manual dispatch per test.
#
# ── SECRETS RICHIESTI (Repository Settings → Secrets and variables → Actions) ─
#   SUPABASE_DB_URL            connection string Postgres
#                              (Supabase → Settings → Database → Connection string,
#                              usare il Session pooler se l'accesso diretto è chiuso)
#   SUPABASE_URL               https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service role key (Settings → API) — serve per
#                              scaricare i file dai bucket Storage privati
#   R2_ACCESS_KEY              Cloudflare R2 Access Key ID
#   R2_SECRET_KEY              Cloudflare R2 Secret Access Key
#   R2_BUCKET                  nome bucket (es. "legmed-backups")
#   R2_ENDPOINT                endpoint S3 R2 — bucket EU: https://<account>.eu.r2.cloudflarestorage.com (con .eu.)
#   BACKUP_PASSPHRASE          passphrase gpg simmetrica (generarla lunga e
#                              conservarla FUORI da GitHub, es. password manager:
#                              senza questa i backup storage NON sono ripristinabili)
#
# Senza questi secrets il workflow FALLISCE (fail-loud, niente backup silenziosamente
# incompleti). Vedi docs/BACKUP-STRATEGY.md per setup completo e procedura di restore.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Ogni domenica alle 03:00 UTC (orario basso traffico)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permette esecuzione manuale dalla UI Actions

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump + Storage → R2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pg_dump 17 (>= Supabase Postgres version)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg lsb-release
          # Postgres APT repo per client recente (pg_dump deve essere >= versione server)
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Install aws CLI (R2 S3-compat upload)
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --update
          fi
          aws --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (per scripts/backup-storage.ts)
        run: pnpm install --frozen-lockfile

      - name: Backup database (pg_dump → R2)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_RETENTION_WEEKS: '12'
        run: |
          chmod +x scripts/backup-db.sh
          ./scripts/backup-db.sh

      - name: Backup Storage buckets (documents + signatures → tar.gz.gpg → R2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_RETENTION_WEEKS: '12'
        run: |
          chmod +x scripts/backup-storage.sh
          ./scripts/backup-storage.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Backup settimanale FALLITO. Controllare i log del job e lo stato dei secrets."
          # TODO: integrare Slack/email webhook quando configurato (vedi docs/SENTRY-ALERTS.md)
